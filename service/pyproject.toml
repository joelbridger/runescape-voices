[project]
name = "gielinor-voices"
version = "0.1.0"
description = "Private localhost AI voice service for visible RuneScape dialogue"
requires-python = ">=3.12,<3.13"
dependencies = [
  "llvmlite==0.44.0",
  "numba==0.61.2",
  "numpy==2.2.6",
  "qwen-tts==0.1.1",
  "sounddevice==0.5.5",
  "soundfile>=0.13,<1",
  "torch==2.9.1",
  "torchaudio==2.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
gielinor-voices = "gielinor_voices.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gielinor_voices"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
